<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="todo-wrapper">
            <h1 class="title">📝 My To-Do List</h1>
            
            <!-- Input Section -->
            <div class="input-section">
                <form id="todoForm">
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="todoInput" 
                            class="todo-input" 
                            placeholder="Add a new task..."
                            autocomplete="off"
                        >
                        <button type="submit" class="add-btn">Add Task</button>
                    </div>
                    <div class="priority-group">
                        <label for="priority">Priority:</label>
                        <select id="priority" class="priority-select">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </form>
            </div>

            <!-- Filter Section -->
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
                <button class="filter-btn" data-filter="high">High Priority</button>
            </div>

            <!-- Stats Section -->
            <div class="stats-section">
                <span class="stat">Total: <span id="totalCount">0</span></span>
                <span class="stat">Completed: <span id="completedCount">0</span></span>
                <span class="stat">Remaining: <span id="remainingCount">0</span></span>
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search tasks..."
                    autocomplete="off"
                >
            </div>

            <!-- Todo List -->
            <ul class="todo-list" id="todoList">
                <!-- Todos will be added here dynamically -->
            </ul>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <p class="empty-icon">🎉</p>
                <p class="empty-text">No tasks yet. Create one to get started!</p>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="clearCompleted" class="clear-btn">Clear Completed</button>
                <button id="clearAll" class="clear-all-btn">Clear All</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
